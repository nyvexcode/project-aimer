name: build
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compilar
        shell: cmd
        run: call build.bat
      - name: Cheat (para distribuir)
        uses: actions/upload-artifact@v4
        with:
          name: AimerExternal
          path: |
            build/AimerExternal.exe
            build/offsets.ini
      - name: Keygen (so para voce)
        uses: actions/upload-artifact@v4
        with:
          name: AimerKeygen
          path: build/AimerKeygen.exe
