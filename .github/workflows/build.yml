name: Build AIMER

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download ImGui (docking)
        shell: pwsh
        run: |
          git clone --branch docking --depth 1 https://github.com/ocornut/imgui.git imgui
          ls imgui
          ls imgui/backends

      - name: Setup MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Build
        shell: cmd
        run: |
          cl /EHsc /std:c++17 /O2 /W3 /I imgui /I imgui\backends ^
            main.cpp memory.cpp aimbot.cpp esp.cpp menu.cpp config.cpp renderer.cpp ^
            imgui\imgui.cpp imgui\imgui_draw.cpp imgui\imgui_tables.cpp imgui\imgui_widgets.cpp ^
            imgui\backends\imgui_impl_win32.cpp imgui\backends\imgui_impl_dx11.cpp ^
            /link d3d11.lib dxgi.lib d3dcompiler.lib user32.lib gdi32.lib kernel32.lib dwmapi.lib ^
            /SUBSYSTEM:WINDOWS /OUT:XYZ.exe

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: XYZ-exe
          path: XYZ.exe
